services:
  - type: web
    name: axiom-canvas
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && pip install gunicorn"
    startCommand: gunicorn api.index:app
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
